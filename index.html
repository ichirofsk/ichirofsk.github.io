<style>
body{margin:0}
a{color:#111111}a:hover{color:#A3201A}
html{background:#ECE8DF}
@keyframes ensoDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-12deg)}60%{opacity:1;transform:scale(.92) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0deg);opacity:0}10%{opacity:.9}100%{transform:translate(-120px,860px) rotate(540deg);opacity:0}}
@keyframes sway{0%,100%{margin-left:0}50%{margin-left:36px}}
@keyframes waveDrift{from{background-position:0 0}to{background-position:-80px 0}}
@keyframes brush{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.enso{stroke-dasharray:1000;stroke-dashoffset:1000;animation:ensoDraw 2.6s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes sunrise{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
@keyframes unsheathe{0%{opacity:0;transform:translateX(-70px)}100%{opacity:1;transform:none}}
@keyframes slash{0%{transform:rotate(-24deg) scaleX(0);opacity:1}35%{transform:rotate(-24deg) scaleX(1);opacity:1}100%{transform:rotate(-24deg) scaleX(1);opacity:0}}
@keyframes glint{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes embers{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(40px,-720px);opacity:0}}
.sun{transform-origin:center;opacity:0;animation:sunrise 1.4s cubic-bezier(.2,.7,.2,1) .2s forwards}
.blade{opacity:0;animation:unsheathe 1.6s cubic-bezier(.4,0,.2,1) .9s forwards}
.slashline{position:absolute;left:-10%;top:52%;width:120%;height:2px;transform-origin:left center;opacity:0;animation:slash 1.2s cubic-bezier(.8,0,.2,1) 2.1s forwards;pointer-events:none}
.glint{transform-origin:center;transform-box:fill-box;opacity:0;animation:glint 1.6s ease-in-out 2.4s 2}
.ember{position:absolute;bottom:-20px;width:4px;height:4px;border-radius:50%;pointer-events:none;animation:embers linear infinite}
.hero-in{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.seal{opacity:0;animation:stamp .7s cubic-bezier(.2,.8,.2,1) 2.2s forwards}
.petal{position:absolute;top:-40px;pointer-events:none;animation:fall linear infinite}
.petal svg{animation:sway 3.2s ease-in-out infinite}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.lift:hover{transform:translateY(-4px)}
.tone{background-image:radial-gradient(rgba(17,17,17,.22) 1px,transparent 1.4px);background-size:7px 7px}
@keyframes speedIn{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes inkDrop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.speed{transform-origin:72% 50%;opacity:0;animation:speedIn 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards}
.ink{transform-box:fill-box;transform-origin:center;opacity:0;animation:inkDrop .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.88) translateY(16px)}100%{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
.zoom img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.zoom:hover img{transform:scale(1.02)}
.brushline path{stroke-dasharray:1400;stroke-dashoffset:1400}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{50%{transform:scale(1.3)}}
@keyframes bub{0%,8%{opacity:0;transform:translateY(6px)}18%,82%{opacity:1;transform:none}100%{opacity:0}}
@keyframes chk{0%,52%{opacity:0;transform:scale(.4)}62%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes offer{0%,64%{opacity:0;transform:translateX(-8px)}74%,90%{opacity:1;transform:none}100%{opacity:0}}
.m-spin{transform-origin:160px 98px;animation:spin 9s linear infinite}
.m-spinr{transform-origin:160px 98px;animation:spin 6s linear infinite reverse}
.m-pulse{transform-origin:160px 98px;animation:pulse 1.6s ease-in-out infinite}
.m-flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.m-bub{transform-box:fill-box;transform-origin:center;opacity:0;animation:bub 6s ease-in-out infinite}
.m-chk{transform-box:fill-box;transform-origin:center;opacity:0;animation:chk 6s ease-in-out infinite}
.m-offer{opacity:0;animation:offer 6s ease-in-out infinite}
@supports (animation-timeline: view()){
.rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
.brushline path{animation:brush linear both;animation-timeline:view();animation-range:entry 10% cover 45%}
}
@supports not (animation-timeline: view()){.brushline path{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
.enso,.hero-in,.seal,.rv,.brushline path,.sun,.blade,.speed,.ink,.pop{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none}
.seal{transform:rotate(-6deg)}
.petal,.ember,.slashline{display:none}
.m-spin,.m-spinr,.m-pulse,.m-flow,.m-bub,.m-chk,.m-offer{animation:none!important;opacity:1!important;transform:none!important}
}
</style>

<style>.settled .hero-in,.settled .enso{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}</style>

const TPL = document.getElementById('tpl');
const ROOT = document.getElementById('app');
let comp, pending = false, first = true;
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.');
  let v;
  for (let i = scope.length - 1; i >= 0; i--) { if (scope[i] && parts[0] in scope[i]) { v = scope[i][parts[0]]; break; } }
  for (let k = 1; k < parts.length && v != null; k++) v = v[parts[k]];
  return v;
}
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
function interp(str, scope){ return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function build(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  if (tag === 'sc-for') {
    const list = look(WHOLE.exec(node.getAttribute('list'))[1], scope) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => { const sc = scope.concat([{ [as]: item, $index: i }]); node.childNodes.forEach(ch => build(ch, sc, out)); });
    return;
  }
  if (tag === 'sc-if') {
    if (look(WHOLE.exec(node.getAttribute('value'))[1], scope)) node.childNodes.forEach(ch => build(ch, scope, out));
    return;
  }
  const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
  for (const a of node.attributes) {
    if (a.name.startsWith('hint-')) continue;
    if (/^on[a-z]+$/i.test(a.name)) { const m = WHOLE.exec(a.value); const fn = m && look(m[1], scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    const v = a.value.includes('{{') ? interp(a.value, scope) : a.value;
    if (a.namespaceURI) el.setAttributeNS(a.namespaceURI, a.name, v); else el.setAttribute(a.name, v);
  }
  const kids = node.localName === 'template' ? node.content.childNodes : node.childNodes;
  kids.forEach(ch => build(ch, scope, el));
  out.appendChild(el);
}

}
